name: ArgoCD Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - "argocd/**"

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      dev: ${{ steps.filter.outputs.dev }}
      staging: ${{ steps.filter.outputs.staging }}
      prod: ${{ steps.filter.outputs.prod }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dev:
              - 'argocd/dev/**'
            staging:
              - 'argocd/staging/**'
            prod:
              - 'argocd/prod/**'

  bootstrap-dev:
    name: Bootstrap dev
    needs: changes
    if: needs.changes.outputs.dev == 'true'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name eks-dev-cluster

      - name: Apply Argo CD root application
        run: |
          kubectl apply \
            --namespace argocd \
            --filename argocd/dev/root-app.yaml

      - name: Show Argo CD applications
        run: |
          kubectl get applications \
            --namespace argocd

  bootstrap-staging:
    name: Bootstrap staging
    needs: changes
    if: needs.changes.outputs.staging == 'true'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name eks-staging-cluster

      - name: Apply Argo CD root application
        run: |
          kubectl apply \
            --namespace argocd \
            --filename argocd/staging/root-app.yaml

      - name: Show Argo CD applications
        run: |
          kubectl get applications \
            --namespace argocd

  bootstrap-prod:
    name: Bootstrap prod
    needs: changes
    if: needs.changes.outputs.prod == 'true'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name eks-prod-cluster

      - name: Apply Argo CD root application
        run: |
          kubectl apply \
            --namespace argocd \
            --filename argocd/prod/root-app.yaml

      - name: Show Argo CD applications
        run: |
          kubectl get applications \
            --namespace argocd
