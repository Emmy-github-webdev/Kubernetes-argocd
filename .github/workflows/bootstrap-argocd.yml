name: ArgoCD Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - "argocd/**"

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap-dev:
    name: Bootstrap dev
    runs-on: ubuntu-latest
    environment: dev

    if: |
      contains(github.event.head_commit.modified, 'argocd/dev/') ||
      contains(github.event.head_commit.added, 'argocd/dev/') ||
      contains(github.event.head_commit.renamed, 'argocd/dev/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name eks-dev-cluster

      - name: Apply Argo CD root application
        run: |
          kubectl apply \
            --namespace argocd \
            --filename argocd/dev/root-app.yaml

      - name: Show Argo CD applications
        run: |
          kubectl get applications \
            --namespace argocd


  bootstrap-staging:
    name: Bootstrap staging
    runs-on: ubuntu-latest
    environment: staging

    if: |
      contains(github.event.head_commit.modified, 'argocd/staging/') ||
      contains(github.event.head_commit.added, 'argocd/staging/') ||
      contains(github.event.head_commit.renamed, 'argocd/staging/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name eks-staging-cluster

      - name: Apply Argo CD root application
        run: |
          kubectl apply \
            --namespace argocd \
            --filename argocd/staging/root-app.yaml

      - name: Show Argo CD applications
        run: |
          kubectl get applications \
            --namespace argocd


  bootstrap-prod:
    name: Bootstrap prod
    runs-on: ubuntu-latest
    environment: prod

    if: |
      contains(github.event.head_commit.modified, 'argocd/prod/') ||
      contains(github.event.head_commit.added, 'argocd/prod/') ||
      contains(github.event.head_commit.renamed, 'argocd/prod/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name eks-prod-cluster

      - name: Apply Argo CD root application
        run: |
          kubectl apply \
            --namespace argocd \
            --filename argocd/prod/root-app.yaml

      - name: Show Argo CD applications
        run: |
          kubectl get applications \
            --namespace argocd