deploymentMode: SingleBinary

singleBinary:
  replicas: 1

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  limits_config:
    retention_period: 30d

  compactor:
    retention_enabled: true
    working_directory: /var/loki/retention

  server:
    http_listen_port: 3100

  analytics:
    reporting_enabled: false

  pattern_ingester:
    enabled: false

persistence:
  enabled: true
  storageClassName: gp3
  size: 50Gi

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      prometheus: kube-prometheus