apiVersion: helm.toolkit.fluxcd.io/v2

kind: HelmRelease

metadata:
  name: loki

spec:
  interval: 30m

  chart:
    spec:
      chart: loki
      version: "6.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      storage:
        type: filesystem

    singleBinary:
      replicas: 1

    persistence:
      enabled: true
      storageClass: gp3
      size: 50Gi