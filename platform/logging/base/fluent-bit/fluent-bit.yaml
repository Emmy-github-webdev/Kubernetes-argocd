apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fluent-bit
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.x

    helm:
      values: |
        config:
          service: |
            [SERVICE]
                Flush 5
                Log_Level info
                Parsers_File parsers.conf

          inputs: |
            [INPUT]
                Name tail
                Path /var/log/containers/*.log
                Parser docker
                Tag kube.*

          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Merge_Log On
                Keep_Log Off

          outputs: |
            [OUTPUT]
                Name loki
                Match *
                Host loki.logging.svc.cluster.local
                Port 3100
                Labels job=fluent-bit

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true