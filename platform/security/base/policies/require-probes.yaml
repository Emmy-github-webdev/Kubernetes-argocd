apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: require-probes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    
spec:
  validationFailureAction: Audit

  background: true

  rules:
    - name: check-probes

      match:
        any:
          - resources:
              kinds:
                - Deployment

      validate:
        message: "Containers must define liveness and readiness probes."

        pattern:
          spec:
            template:
              spec:
                containers:
                  - livenessProbe: "?*"
                    readinessProbe: "?*"