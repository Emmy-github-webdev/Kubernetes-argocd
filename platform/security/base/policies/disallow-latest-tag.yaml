apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: disallow-latest-tag
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  validationFailureAction: Audit

  background: true

  rules:

    - name: validate-image-tag

      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob

      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - flux-system

      validate:
        message: "Images must use a version tag and cannot use latest."

        pattern:
          spec:
            template:
              spec:
                containers:
                  - image: "!*:latest"