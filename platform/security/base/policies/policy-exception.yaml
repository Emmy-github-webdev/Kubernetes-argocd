apiVersion: kyverno.io/v2
kind: PolicyException

metadata:
  name: system-namespaces-exception
  namespace: kyverno

spec:
  exceptions:
    - policyName: "*"
      ruleNames:
        - "*"

  match:
    any:
      - resources:
          namespaces:
            - kube-system
            - kyverno
            - flux-system