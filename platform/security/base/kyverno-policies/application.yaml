apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kyverno-policies
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Emmy-github-webdev/Kubernetes-argocd.git
    targetRevision: main
    path: platform/policies/overlays/dev

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true