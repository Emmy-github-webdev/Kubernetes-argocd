apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: metrics-server
  namespace: kube-system

spec:
  interval: 30m

  chart:
    spec:
      chart: metrics-server
      version: "3.13.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: metrics-server-values
      valuesKey: values.yaml