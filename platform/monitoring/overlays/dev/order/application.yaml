apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: product-postgres-exporter
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-postgres-exporter
    targetRevision: 6.8.0

    helm:
      valuesObject:
        serviceMonitor:
          enabled: true

    config:
      datasource:
        host: order-postgres.dev.svc.cluster.local
        port: "5432"
        database: orderdb

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true