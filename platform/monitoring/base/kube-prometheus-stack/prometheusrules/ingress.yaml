apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: ingress-alerts

  labels:
    prometheus: kube-prometheus

spec:

  groups:

    - name: ingress.rules

      rules:


        - alert: ALBControllerErrors

          expr: |
            rate(
              aws_loadbalancer_controller_reconcile_errors_total[5m]
            ) > 0

          for: 10m

          labels:
            severity: warning

          annotations:
            summary: AWS Load Balancer Controller errors
            description: >
              ALB controller is reporting reconciliation errors.


        - alert: HighHTTP5xxRate

          expr: |
            (
              sum(rate(
                http_server_requests_seconds_count{
                  status=~"5.."
                }[5m]))
              /
              sum(rate(
                http_server_requests_seconds_count[5m]))
            ) > 0.05

          for: 5m

          labels:
            severity: critical

          annotations:
            summary: High HTTP 5xx error rate
            description: >
              More than 5% of HTTP requests are returning errors.