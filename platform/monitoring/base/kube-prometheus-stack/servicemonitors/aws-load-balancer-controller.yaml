apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: aws-load-balancer-controller

  labels:
    prometheus: kube-prometheus

spec:
  namespaceSelector:
    matchNames:
      - kube-system

  selector:
    matchLabels:
      app.kubernetes.io/name: aws-load-balancer-controller

  endpoints:
    - port: metrics
      interval: 30s