apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: payment-service
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    
  labels:
    prometheus: kube-prometheus

spec:
  selector:
    matchLabels:
      app: payment-service

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s