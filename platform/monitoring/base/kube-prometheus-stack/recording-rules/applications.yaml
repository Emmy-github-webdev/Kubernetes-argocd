apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: application-recording-rules

  labels:
    prometheus: kube-prometheus

spec:

  groups:

    - name: application.recording.rules

      interval: 30s

      rules:

        - record: app:http_requests:rate5m

          expr: |
            sum by(
              application
            )
            (
              rate(
                http_server_requests_seconds_count[5m]
              )
            )


        - record: app:http_errors:rate5m

          expr: |
            sum by(
              application
            )
            (
              rate(
                http_server_requests_seconds_count{
                  status=~"5.."
                }[5m]
              )
            )


        - record: app:http_latency:p95

          expr: |
            histogram_quantile(
              0.95,
              sum by(
                application,
                le
              )
              (
                rate(
                  http_server_requests_seconds_bucket[5m]
                )
              )
            )