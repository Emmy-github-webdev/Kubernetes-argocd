apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: grafana

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector: {}

      ports:
        - protocol: TCP
          port: 3000