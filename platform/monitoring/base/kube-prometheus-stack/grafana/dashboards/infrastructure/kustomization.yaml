apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:

- name: grafana-dashboard-infrastructure
  files:
    - kubernetes-cluster.json
    - nodes.json
    - etcd.json
    - kubernetes-overview.json
    - cluster-capacity.json
    - namespaces.json
    - pods.json
    - api-server.json
    - scheduler.json
    - controller-manager.json
    
generatorOptions:
  disableNameSuffixHash: true

commonLabels:
  grafana_dashboard: "1"