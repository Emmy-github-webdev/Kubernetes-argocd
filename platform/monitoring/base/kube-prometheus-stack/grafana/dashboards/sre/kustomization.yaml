apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:

- name: grafana-dashboard-sre

  files:
    - slo.json
    - api-latency.json
    - alerts.json
    - availability.json
    - error-budget.json
    - capacity-planning.json

generatorOptions:
  disableNameSuffixHash: true

commonLabels:
  grafana_dashboard: "1"