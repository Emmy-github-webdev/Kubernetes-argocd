apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-datasource-tempo

  labels:
    grafana_datasource: "1"

data:
  tempo.yaml: |
    apiVersion: 1

    datasources:

    - name: Tempo

      uid: tempo

      type: tempo

      access: proxy

      url: http://tempo.monitoring.svc.cluster.local:3200

      editable: false