apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-datasource-prometheus

  labels:
    grafana_datasource: "1"

data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:

    - name: Prometheus
      uid: prometheus

      type: prometheus

      access: proxy

      url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

      isDefault: true

      editable: false