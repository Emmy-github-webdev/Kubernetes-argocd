apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helm-repository.yaml
  - helm-release.yaml
  - exporters/
  - prometheusrules/
  - servicemonitors/

configMapGenerator:
  - name: prometheus-stack-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true