apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - helm-repository.yaml
  - helm-release.yaml
  - exporters/
  - prometheusrules/

configMapGenerator:
  - name: prometheus-stack-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true