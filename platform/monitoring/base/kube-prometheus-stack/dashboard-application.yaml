apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: grafana-dashboards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: default

  source:
    repoURL: https://github.com/Emmy-github-webdev/Kubernetes-argocd.git
    targetRevision: main
    path: platform/monitoring/base/kube-prometheus-stack/grafana/dashboards

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true