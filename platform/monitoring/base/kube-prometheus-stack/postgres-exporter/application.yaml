apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: postgres-exporter
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-postgres-exporter
    targetRevision: 6.8.0

    helm:
      valuesObject:
        serviceMonitor:
          enabled: true

  destination:
    server: https://kubernetes.default.svc


  syncPolicy:
    automated:
      prune: true
      selfHeal: true