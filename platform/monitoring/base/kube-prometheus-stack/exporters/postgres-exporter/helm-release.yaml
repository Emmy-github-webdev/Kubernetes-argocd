apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: postgres-exporter

spec:
  interval: 30m

  chart:
    spec:
      chart: prometheus-postgres-exporter
      version: "6.8.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system

  values:
    serviceMonitor:
      enabled: true

    config:
      datasource:
        host: postgres.default.svc.cluster.local
        port: "5432"
        database: postgres