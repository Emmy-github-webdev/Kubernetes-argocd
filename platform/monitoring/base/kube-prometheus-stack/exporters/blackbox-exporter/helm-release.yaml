apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: blackbox-exporter

spec:
  interval: 30m

  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "9.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system

  values:
    serviceMonitor:
      enabled: true

    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            preferred_ip_protocol: ip4