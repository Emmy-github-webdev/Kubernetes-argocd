grafana:
  enabled: true

  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  service:
    type: ClusterIP

  persistence:
    enabled: true
    storageClassName: gp3
    size: 20Gi

  # Disable the dashboards bundled with kube-prometheus-stack.
  # Dashboards are provisioned from Git via ConfigMaps.
  defaultDashboardsEnabled: false

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

      # Watch ConfigMaps with this label.
      label: grafana_dashboard

      # Keep the default label value.
      labelValue: "1"

      # Automatically update dashboards when ConfigMaps change.
      watchMethod: WATCH

    datasources:
      enabled: true

      # Watch datasource ConfigMaps.
      label: grafana_datasource
      labelValue: "1"

prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 30GB

    serviceMonitorSelector:
      matchLabels:
        prometheus: kube-prometheus

    ruleSelector:
      matchLabels:
        prometheus: kube-prometheus

    ruleNamespaceSelector: {}

    serviceMonitorNamespaceSelector: {}

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    retention: 120h

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

    secrets:
      - alertmanager-notification-secret

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by:
        - alertname
        - namespace

      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      receiver: default-receiver

      routes:
        - matchers:
            - severity="critical"
          receiver: slack-critical

    receivers:
      - name: default-receiver

      - name: slack-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-notification-secret/slack-webhook
            channel: "#alerts"
            send_resolved: true
            title: "{{ .CommonAnnotations.summary }}"

      - name: email-alerts
        email_configs:
          - to: platform-team@example.com
            from: alertmanager@example.com
            smarthost: smtp.example.com:587
            auth_username: alertmanager@example.com
            auth_password_file: /etc/alertmanager/secrets/alertmanager-email-secret/password

    inhibit_rules:
      - source_matchers:
          - severity="critical"

        target_matchers:
          - severity="warning"

        equal:
          - namespace
          - alertname

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true