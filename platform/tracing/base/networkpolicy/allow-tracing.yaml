apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:

  name: allow-tracing

  namespace: tracing


spec:

  podSelector:

    matchLabels:

      app.kubernetes.io/name: opentelemetry-collector


  policyTypes:

    - Ingress


  ingress:


    - from:

        - namespaceSelector: {}

      ports:

        - protocol: TCP

          port: 4317


        - protocol: TCP

          port: 4318