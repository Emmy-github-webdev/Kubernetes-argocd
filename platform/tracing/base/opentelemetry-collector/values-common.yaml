mode: deployment


replicaCount: 2


image:

  repository: otel/opentelemetry-collector-contrib


ports:

  otlp:
    enabled: true

    containerPort: 4317

    servicePort: 4317

    protocol: TCP


  otlp-http:
    enabled: true

    containerPort: 4318

    servicePort: 4318

    protocol: TCP


config:
  exporters:

    otlp/tempo:

      endpoint: tempo.tracing.svc.cluster.local:4317

      tls:
        insecure: true


  service:

    pipelines:

      traces:

        receivers:
          - otlp

        processors:
          - batch

        exporters:
          - otlp/tempo