apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: opentelemetry-collector
  namespace: tracing


spec:

  interval: 30m


  chart:
    spec:
      chart: opentelemetry-collector

      version: "0.113.0"

      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system


  valuesFrom:

    - kind: ConfigMap
      name: otel-values
      valuesKey: values.yaml