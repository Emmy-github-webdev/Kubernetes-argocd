apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: tempo

spec:
  interval: 30m

  chart:
    spec:
      chart: tempo
      version: "1.18.2"

      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: tempo-values
      valuesKey: values.yaml