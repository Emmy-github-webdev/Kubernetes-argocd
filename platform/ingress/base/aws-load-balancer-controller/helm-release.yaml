apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: aws-load-balancer-controller

spec:
  interval: 30m

  chart:
    spec:
      chart: aws-load-balancer-controller
      version: "1.13.4"
      sourceRef:
        kind: HelmRepository
        name: eks
        namespace: flux-system

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: aws-load-balancer-controller-values
      valuesKey: values.yaml