apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: external-dns

spec:
  interval: 30m

  chart:
    spec:
      chart: external-dns
      version: "1.18.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: external-dns-values
      valuesKey: values.yaml