apiVersion: cert-manager.io/v1
kind: ClusterIssuer

metadata:
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  acme:
    email: admin@staging.example.com

    server: https://acme-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: letsencrypt-account-key

    solvers:
      - http01:
          ingress:
            ingressClassName: alb