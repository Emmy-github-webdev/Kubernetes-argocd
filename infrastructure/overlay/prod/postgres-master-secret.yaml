apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: postgres-master
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: postgres-master

  dataFrom:
    - extract:
        key: /prod/postgres/master