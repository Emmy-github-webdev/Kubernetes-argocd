apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: staging-infrastructure
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - name: infrastructure
            path: infrastructure/overlay/staging
            namespace: staging

  template:
    metadata:
      name: '{{name}}-staging'

    spec:
      project: default

      source:
        repoURL: https://github.com/Emmy-github-webdev/Kubernetes-argocd.git
        targetRevision: main
        path: '{{path}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'

      revisionHistoryLimit: 5

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

        syncOptions:
          - CreateNamespace=true  
                                                                                                                                                                                                